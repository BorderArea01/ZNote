name: 功能建议 / Feature request
description: 描述使用场景与希望改善的体验
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题？
      description: 请描述真实使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎样改善？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法或参考
