name: Build clients
on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        default: all
        options: [all, desktop, android]
permissions:
  contents: read
jobs:
  desktop:
    if: inputs.target != 'android'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix clients/desktop
      - run: node clients/desktop/node_modules/electron/install.js
      - run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test built desktop and local service
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export ZNOTE_DESKTOP_EXE="$GITHUB_WORKSPACE/clients/desktop/release/win-unpacked/ZNote.exe"
          else
            export ZNOTE_DESKTOP_EXE="$(find "$GITHUB_WORKSPACE/clients/desktop/release" -path '*/ZNote.app/Contents/MacOS/ZNote' -type f | head -n 1)"
          fi
          test -n "$ZNOTE_DESKTOP_EXE"
          node tests/desktop-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.os }}
          path: |
            clients/desktop/release/*.exe
            clients/desktop/release/*.zip
            clients/desktop/release/*.dmg
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}
          path: artifacts/desktop-smoke-*/*.png
  android:
    if: inputs.target != 'desktop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build unsigned release for controlled signing
        working-directory: clients/android
        run: bash gradlew --no-daemon :app:assembleRelease :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :capturefixture:assembleDebug
      - name: Exercise Android client in isolated emulator
        run: bash scripts/test-android-emulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-unsigned
          path: clients/android/app/build/outputs/apk/release/*unsigned.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-emulator-evidence
          path: artifacts/android-emulator/
