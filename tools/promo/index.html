<body>
  <main id="stage"><div id="scene-root"></div><div id="caption"></div><div id="progress"></div></main>
  <script>
    const logo = `<svg aria-hidden="true" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="18" fill="#153E39"/>
  <path d="M16 23C23 14 35 24 46 18C49 16.5 49 20.5 43 25.5L20 42.5C16 46 18 49 22 46.5C30 41.5 42 51 49 42" fill="none" stroke="#FBF8ED" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
    const meta = number => `<div class="meta"><div class="brand-mini">${logo}<span>ZNOTE / FIELD NOTES</span></div><span>${String(number).padStart(2,'0')} / ${String(list.length).padStart(2,'0')}</span></div>`;
    const dots = `<span class="dot a"></span><span class="dot b"></span><span class="dot c"></span>`;
    const photos = `<div class="photo"><div class="sun-circle"></div><div class="hill"></div><div class="hill two"></div></div><div class="photo arch"></div><div class="photo flowerpic"></div>`;
    const scenes = {
      opening: () => `<section class="scene light opening">${meta(1)}<div class="flower" style="right:-110px;top:-170px;width:490px;height:490px"></div><div class="title-wrap"><div class="smallcap entry">A SMALL IDEA</div><h1 class="entry s2">本来只是想<br><span class="accent">做个笔记。</span></h1><p class="entry s3">后来发现，问题根本不在“会不会记”。</p></div><div class="paper one"><b>灵感 · 001</b><div class="scribble"></div><div class="scribble" style="width:70%"></div><div class="scribble" style="width:84%"></div></div><div class="paper two"><b>回头再看</b><div class="scribble"></div><div class="scribble" style="width:78%"></div></div><div class="hero-mark entry s3">${logo}</div><div class="number">01</div></section>`,

      wechat: () => `<section class="scene mint wechat">${meta(8)}<div class="phone fly-left"><div class="phone-header"><span>微信 · 灵感聊天</span><span>•••</span></div><div class="bubble mine entry s2">记一下：海边逆光的构图，人物放在右侧。</div><div class="bubble mine entry s3" style="width:112px;height:74px;background:#a7cbb9;display:grid;place-items:center;font-size:38px">▧</div><div class="bubble theirs entry s4">ZNote：已收入今天的笔记 ✓</div><div class="phone-bottom"></div></div><div class="arrow">→</div><h2 class="entry" style="left:638px;top:126px">聊天时想到，<br><span class="accent">就聊天时记。</span></h2><div class="note-card"><strong>微信收件 · 今天</strong><div class="scribble"></div><div class="scribble" style="width:67%"></div><small>文字 + 配图 · 视觉灵感 · 自动按天合并</small></div><div class="tag saved">✓ 已进入知识库</div><div class="number">08</div></section>`,

      image_focus: () => `<section class="scene light image-focus">${meta(10)}<div class="window gallery-window fly-left"><div class="window-top">${dots}<span style="margin-left:10px">图片组 · 海边参考 · 8 张</span></div><div class="gallery-hero photo"><div class="sun-circle"></div><div class="hill"></div><div class="hill two"></div></div><div class="gallery-thumbs"><div class="photo"><div class="sun-circle"></div><div class="hill"></div><div class="hill two"></div></div><div class="photo arch"></div><div class="photo flowerpic"></div><div class="photo"><div class="sun-circle"></div><div class="hill"></div></div><div class="page-count">01 / 08 ↔</div></div></div><div class="feature-copy"><div class="smallcap entry">IMAGE-FIRST LIBRARY</div><h2 class="entry s2">图片，<br><span class="accent">不只是附件。</span></h2><div class="feature-list entry s3"><div><b>01</b>单张与图片组分别整理</div><div><b>02</b>翻页、调整顺序与封面</div><div><b>03</b>标签筛选，原文件保留</div></div></div><div class="origin-tag">出处与作品信息，也能继续追溯。</div><div class="number">10</div></section>`,

      library: () => `<section class="scene dark library">${meta(12)}<div class="window library-window entry"><div class="window-top">${dots}<span style="margin-left:10px">ZNote · 我的知识库</span></div><div class="layout"><div class="sidebar"><div>全部内容</div><div class="sel">视觉灵感</div><div>图片素材</div><div>图文笔记</div><div>视频素材</div></div><div class="results"><div class="search"><span class="lens"></span>海边构图</div><div class="cards"><div class="card"><div class="photo"><div class="sun-circle"></div><div class="hill"></div><div class="hill two"></div></div><div class="label">海边参考图<span>图片组 · 8 张 · 有来源</span></div></div><div class="card"><div class="photo arch"></div><div class="label">构图笔记<span>笔记 · 微信灵感</span></div></div><div class="card"><div class="photo flowerpic"></div><div class="label">光线记录<span>图文笔记 · 3 张配图</span></div></div></div></div></div></div><div class="tag result-badge">✓ 找回来了</div></section>`,
      closing: () => `<section class="scene dark closing">${meta(13)}<div class="ring"></div><div class="ring two"></div><div class="logo entry">${logo}</div><div class="close-text"><div class="smallcap entry" style="color:var(--mint)">ZNOTE · YOUR SECOND LOOK</div><h1 class="entry s2">把看见，<br><span class="sun-text">变成找得到。</span></h1><p class="entry s3">ZNote · 让知识看得见</p></div><div class="footer">CHAT · WEB · MOBILE · YOUR LIBRARY</div></section>`,
    };
    let list=[], total=0, current=-1, started=0, playing=false, raf;
    const root=document.getElementById('scene-root'), caption=document.getElementById('caption'), progress=document.getElementById('progress');
    function show(i){if(i===current)return;current=i;root.innerHTML=scenes[list[i].id]();caption.textContent=list[i].voice;}
    function seek(t){t=Math.max(0,Math.min(total-.001,t));let i=list.findIndex(item=>t>=item.start&&t<item.end);if(i<0)i=list.length-1;show(i);progress.style.width=(t/total*100)+'%';return {scene:list[i].id,time:t,total};}
    function tick(){if(!playing)return;const t=(performance.now()-started)/1000;if(t>=total){seek(total-.001);playing=false;return;}seek(t);raf=requestAnimationFrame(tick)}
    function play(){cancelAnimationFrame(raf);started=performance.now();playing=true;seek(0);raf=requestAnimationFrame(tick)}
    function fit(){const scale=Math.min(innerWidth/1280,innerHeight/720);document.getElementById('stage').style.transform=`scale(${scale})`}
    window.addEventListener('resize',fit);fit();
    fetch('./storyboard.json').then(r=>r.json()).then(data=>{let at=0;list=data.map(item=>{const start=at;at+=item.seconds;return {...item,start,end:at}});total=at;seek(0);window.ZNotePromo={play,seek,get duration(){return total},get scenes(){return list}};document.body.dataset.ready='true'});
  </script>
