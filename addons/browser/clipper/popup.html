<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>ZNote · 网页采集</title><link rel="stylesheet" href="style.css"></head>
<body class="popup"><main>
  <div class="brand">ZNote <small>浏览器采集</small></div>
  <div class="intro"><h1>留住眼前的灵感</h1><p id="shortcut-help">悬停图片预览大图</p></div>
  <div class="tools">
    <button id="discover" class="primary"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m3 18 6-5 4 3 4-6 4 5"/></svg><span>嗅探本页视频</span></button>
    <button id="article"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h6"/></svg><span>保存页面正文（Markdown）</span></button>
    <button id="video"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="m10 8 6 4-6 4z"/></svg><span>平台视频链接解析</span></button>
    <button id="capture"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 8V4h4m8 0h4v4m0 8v4h-4m-8 0H4v-4"/><rect x="7" y="7" width="10" height="10" rx="2"/></svg><span>截图当前页面</span></button>
  </div>
  <p id="status" role="status"></p><a id="open" hidden target="_blank">打开已保存的资源</a>
  <div id="video-status" role="status"></div><a id="video-open" hidden target="_blank">打开已保存的视频</a><button id="cancel-video" hidden>取消视频采集</button>
  <div class="actions"><span class="local-label">YOUR KNOWLEDGE SPACE</span><button id="settings">连接设置</button></div>
</main><script type="module" src="popup.js"></script></body></html>
