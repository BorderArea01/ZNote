      <rect x="22" y="21" width="62" height="20" rx="10" fill="#dad2e8"/>
      <text x="35" y="36" fill="#65527f" font-size="10" letter-spacing="1">NOTES</text>
      <text x="23" y="76" fill="#34354c" font-size="21" font-weight="600">让收藏，也有上下文。</text>
      <path d="M24 100H245M24 116H209M24 132H158" stroke="#b6b0c4" stroke-width="5" stroke-linecap="round"/>
