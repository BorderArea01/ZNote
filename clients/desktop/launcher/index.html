<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>ZNote · 连接知识库</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="fragments.css?v=9"></head><body><main><img class="brand" src="icon.png" alt="ZNote"><p class="eyebrow">YOUR LOCAL KNOWLEDGE LIBRARY</p><h1>让灵感，有一个家。</h1><p class="intro">连接已有知识库，或在这台电脑开始收藏。</p><section class="signal-surface"><h2>连接知识库</h2><form id="connect"><label for="address">服务器地址</label><input id="address" name="address" type="text" placeholder="http://192.168.1.10:3741" autocomplete="url" required><button type="submit" class="signal-button">连接并打开</button></form><small>使用电脑或 NAS 的地址。访问密码在连接成功后填写。</small></section><section class="signal-surface"><h2>在本机使用</h2><p>内置运行环境，图片与笔记保存在此电脑。保持 ZNote 运行，手机也能连接。</p><button id="local" class="secondary signal-button">打开本机知识库</button><small>已有 localhost:3741 服务时直接连接，不迁移或覆盖旧数据。</small></section><details class="appearance"><summary>界面外观</summary><div class="appearance-fields"><label>界面风格<select id="style"><option value="minimal">简约</option><option value="glass">毛玻璃</option><option value="cyber">赛博朋克</option><option value="paper">纸感</option><option value="glitch">建筑故障</option></select></label><label>明暗模式<select id="mode"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">夜间</option></select></label><label id="motion-setting" hidden>主题动效<select id="motion"><option value="dynamic">动态</option><option value="still">静态</option></select></label></div></details><details><summary>本机视频采集组件</summary><p>首帧封面、平台解析与 HLS 合并需 FFmpeg / yt-dlp。约下载 50–70 MB，从上游获取并校验。</p><button id="media" class="secondary">安装可选视频组件</button></details><p id="status" role="status" aria-live="polite"></p><footer><span id="version"></span><button id="feedback" class="link">反馈与帮助 ↗</button></footer></main><script src="motion.js?v=9"></script><script src="app.js"></script></body></html>
